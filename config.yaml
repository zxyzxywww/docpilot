# ============================================================
# DocPilot 配置中心 —— 所有可调参数集中管理
# 模型 / 检索 / 分块 / 数据库 / 预算 / 日志 全部在此
# ============================================================

# ---- MVP 定位红线(同时写入 README 与 system prompt)----
mvp:
  purpose: "仅面向 Python 后端官方开发文档(FastAPI/Pydantic/SQLAlchemy/Python)的技术问答"
  official_docs_only: true        # 仅检索白名单官方文档(不引入外部随意内容)
  no_user_data: true              # 不处理任何用户隐私/私有数据
  refuse_without_evidence: true   # 证据不足必须拒答
  citations_required: true        # 技术结论必须带真实检索证据与官方文档引用

# ---- LLM 供应商(全部 API,无本地模型)----
llm:
  chat:
    provider: "deepseek"
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-flash"    # 开发期;效果不足可切 deepseek-v4-pro
    temperature: 0.2
    max_tokens: 2048
    timeout_seconds: 60
    max_retries: 3
    backoff_base_seconds: 1.0
    # 前缀缓存利用:固定 system + 文档块为共享前缀(降低费用)

  embedding:
    provider: "siliconflow"
    base_url: "https://api.siliconflow.cn/v1"
    model: "BAAI/bge-m3"          # 固定;变更模型/维度/分块策略必须重建索引
    dimension: 1024
    batch_size: 32
    max_concurrency: 4
    timeout_seconds: 60
    max_retries: 3

  rerank:
    provider: "siliconflow"
    base_url: "https://api.siliconflow.cn/v1"
    model: "BAAI/bge-reranker-v2-m3"
    batch_size: 16
    timeout_seconds: 60
    max_retries: 3

# ---- 检索链路默认参数(由阶段五评估结果调整)----
retrieval:
  dense_top_k: 30                 # 向量通道召回数
  bm25_top_k: 30                  # BM25 通道召回数
  rrf_top_k: 30                   # RRF 融合后取前 N
  rerank_top_k: 20                # rerank 后保留数
  final_context_k: 6              # 最终注入生成的上下文数
  rrf_k: 60                       # RRF 融合常数

# ---- 分块策略 ----
chunking:
  chunk_size_tokens: 600
  chunk_overlap_tokens: 100

# ---- 存储 ----
database:
  sqlite_path: "data/db/docpilot.db"     # 唯一事实来源(文档/chunk 元数据/导入状态)
  qdrant:
    mode: "docker"                      # local(开发) | docker(部署);部署前改为 docker
    path: "data/db/qdrant"              # local mode 持久化目录(可重建派生索引)
    collection: "docpilot_chunks"
    docker_url: "http://localhost:6333"

# ---- 成本预算(学生预算,全透明)----
budget:
  max_cost_yuan: 50.0                   # 开发期总预算上限
  max_tokens_per_query: 8000            # 单次查询 token 上限(护栏用)
  track_costs: true                     # 观测日志记录估算费用

# ---- Agent 护栏(阶段四:全部可配置)----
agent:
  max_steps: 8                          # ReAct 循环最大步数
  tool_timeout_seconds: 30              # 单次工具执行超时
  max_tool_retries: 2                   # 工具失败重试次数
  max_consecutive_repeat: 2             # 连续重复同一动作次数上限(防死循环)
  max_cost_yuan_per_query: 0.5          # 单次查询费用预算

# ---- 生成层(阶段五调参:拒答相关性阈值)----
rag:
  min_relevance_score: 0.3              # 检索证据相关性下限(rerank 分数),低于则拒答
  gate_enabled: true                    # 灰区语义门控:rerank 分数在 [min, gate_threshold) 时再判一次"证据是否真能回答该问题"
  gate_threshold: 0.6                   # 灰区上界;分高于此直接生成(域内高分题不触发,零额外成本/延迟)

# ---- 观测日志(约束 7:轻量可观测)----
logging:
  level: "INFO"
  trace: true                           # 输出 trace_id / 延迟 / token / 费用
