name: CI

# CI 默认仅运行离线 mock 测试,不调用任何真实付费 API。
# integration 标记的测试(需要真实 key)一律跳过。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (aligned with pyproject.toml / conda env)
        run: |
          python -m pip install --upgrade pip
          pip install \
            openai pydantic python-dotenv pyyaml qdrant-client pypdf \
            fastapi uvicorn python-multipart \
            pytest pytest-mock ruff mypy

      - name: Lint (ruff)
        run: ruff check . --no-cache

      - name: Type check (mypy)
        run: mypy --cache-dir=/dev/null

      - name: Test (offline mock only, integration skipped)
        run: pytest -m "not integration" -q -p no:cacheprovider

      - name: Frontend type check & build (web/)
        run: |
          cd web
          npm ci
          npm run build
