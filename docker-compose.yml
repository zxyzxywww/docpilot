# MediDoc 部署编排:Qdrant + API(server)+ Web(web/)
# 用法(在项目根目录,key 从 .env 自动读取):
#   docker compose up --build -d
# 访问:http://localhost:3000(交互文档 http://localhost:8000/docs)
#
# 部署前:config.yaml 中 qdrant.mode 改为 docker,
# 然后执行 python scripts/reindex.py 重建 Qdrant(约束 3)。
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      # 映射到宿主机:本机 reindex.py 与 config.docker_url 均走 localhost:6333
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    # qdrant 镜像无 curl/wget 且默认 sh 不支持 /dev/tcp,显式用 bash 做 HTTP 健康检查
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    volumes:
      # 事实来源(SQLite)与原始文献挂载到宿主机,持久化;config 同步宿主配置
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # 浏览器访问的是宿主端口,因此固定指向宿主 8000
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  qdrant_storage:
