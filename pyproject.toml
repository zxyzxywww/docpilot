[project]
name = "docpilot"
version = "0.1.0"
description = "DocPilot - 面向 Python 后端开发文档的 Agentic RAG 知识助手"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.12",
    "pypdf>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: 需要真实 API key 的集成测试(默认跳过)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
files = ["src", "server"]
ignore_missing_imports = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pygments>=2.17",
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]
